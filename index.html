}
function add(id,src,msg){ addItem(id,src); toast(msg||`Added ${nm(id)} · ${money(pr(id))}`); advanceFor('add:'+id); maybeNudge(id); }
function maybeNudge(id){ if((id==='pasta'||id==='tomsauce')&&inList('pasta')&&inList('tomsauce')&&!inList('cheese')&&!inList('salad')&&!S.nudged){ S.nudged=1; setTimeout(()=>banner('Make it a complete dinner','Add grated cheese and a side salad? Tap to see options.',['ask','Complete my pasta dinner']),900); } }
function openSheet(k,arg){ ui.sheet=k; ui.arg=arg; ui.cap=false; if(k==='plan') ui.plan=null; if(k==='settings') ui.confirmReset=false; render(); advanceFor('sheet:'+k); }
function blk(ref){ const [m,b]=ref.split(':').map(Number); return S.chat[m].b[b]; }
function startScenario(id){
  const keepC=S.country; S=freshState(); S.country=keepC; S.onboarded=true; S.scenario=id; S.step=0;
  if(id==='store') S.list=['bananas','apples','buns','yogurt','pasta','tomsauce','coffee','detergent'].map(p=>({p,q:1,ck:0})), S.nudged=1;
  if(id==='issue') S.nudged=1;
  S.startValue=listTotal();
  Object.assign(ui,{sheet:null,plan:null,sel:{},cap:false,typing:false,q:'',cat:'all',onb:0});
  ui.tab=SCEN.find(s=>s.id===id).tab; lastTab=null; render(); toast('Scenario ready: '+SCEN.find(s=>s.id===id).t);
}
function fastForward(){
  S.day+=14; const msgs=[];
  Object.keys(S.ess).forEach(id=>{ if(id==='dogfood'&&!S.hh.dog)return; const st=essState(id); if(st[0]!=='ok'&&S.ess[id].remind) msgs.push([`${ESS_DEF[id].label}: ${st[1].toLowerCase()}`,`Estimated ${daysTxt(remaining(id))} left. Tap to review.`]); });
  msgs.forEach((m,i)=>notify(m[0],m[1],false));
  if(msgs.length) banner(msgs[0][0],msgs[0][1],['tab','today']);
  toast('Jumped ahead 2 weeks (demo time)'); advanceFor('ff');
}
const A={
  tab(v){ if(S.storeOn&&v) S.storeOn=false; ui.tab=v; ui.cap=false; ui.sheet=null; render(); advanceFor('tab:'+v); if(v==='ask') scrollChat(); },
  sheet(v){ openSheet(v); }, closeSheet(){ ui.sheet=null; render(); }, capClose(){ ui.cap=false; render(); },
  add(v){ add(v); render(); },
  qty(v,e){ const l=inList(v), d=+e.dataset.d; if(!l){ add(v); } else { l.q+=d; if(l.q<=0){ S.list=S.list.filter(x=>x!==l); toast(`Removed ${nm(v)}`);} else maybeNudge(v); } render(); },
  ck(v){ const l=inList(v); l.ck=l.ck?0:1; if(S.storeOn&&l.ck){ toast(`Picked ${nm(v)} · +${money(pr(v)*l.q)}`); if(v==='buns'&&!S.storeSugg.buns) S.storeSugg.buns='open'; } render(); },
  addDog(){ add('dogfood','Replenish','Dog food added to your list'); render(); },
  addSoap(){ add('soap','Replenish'); render(); },
  addEggs(){ add('eggs','Cake idea','Eggs added · '+money(pr('eggs'))); render(); },
  addRefill(v){ add(v,'Replenish'); render(); },
  snooze(v){ S.snoozed[v]=1; toast('Snoozed for 3 days'); render(); }, unsnooze(v){ delete S.snoozed[v]; render(); },
  dismiss(v){ S.dismissed[v]=1; toast('Dismissed. Nothing was added.'); render(); },
  why(v){ openSheet('why',v); },
  editReco(v){ if(S.ess[v]) A.openEss(v); else openSheet(v); },
  openEss(v){ ui.back=ui.sheet==='detergent'?'detergent':null; openSheet('ess',v); },
  remind(v){ S.ess[v].remind=!S.ess[v].remind; toast(S.ess[v].remind?'Reminder on. You’ll get an in-app preview.':'Reminder off'); render(); },
  ff(){ fastForward(); render(); },
  cat(v){ ui.cat=v; ui.q=''; render(); }, shopOffers(){ ui.cat='offers'; ui.q=''; A.tab('shop'); },
  swap(v){ const i=+v, cur=ui.plan; const opts=SWAPS.filter(m=>!cur.includes(m)); const idx=(SWAPS.indexOf(cur[i])+1); let n=opts.find(m=>SWAPS.indexOf(m)>=idx)||opts[0]; cur[i]=n; render(); },
  regen(){ const pool=[...SWAPS].sort(()=>Math.random()-.5); ui.plan=pool.slice(0,5); render(); toast('New plan generated'); },
  addPlan(){ const meals=ui.plan||planMeals(); const {miss}=planMissing(meals); miss.forEach(i=>addItem(i,'Meal plan')); S.plan={meals:[...meals],added:true}; ui.sheet=null; toast(miss.length?`Added ${miss.length} ingredients · ${money(sum(miss))}`:'Plan saved'); render(); advanceFor('addPlan'); },
  addMany(v,e){ const ids=v.split(','); ids.forEach(i=>addItem(i,e.dataset.src||'Suggested')); toast(`Added ${ids.length} items · ${money(sum(ids))}`); render(); },
  cooked(){ S.pantry=S.pantry.filter(x=>x.id!=='spinach'); ui.sheet=null; toast('Nice! Spinach removed from Use soon'); render(); },
  pickDet(v){ S.list=S.list.filter(l=>l.p!=='detergent'&&l.p!=='detergentXL'); add(v,'Refill'); advanceFor('add:detergent'); render(); },
  useSugg(v){ const [id,d]=v.split(':'); S.ess[id].dur=+d; render(); },
  exp(v,e){ const x=S.pantry.find(p=>p.id===v); x.exp=Math.max(S.day,x.exp+ +e.dataset.d); render(); },
  usedUp(v){ S.pantry=S.pantry.filter(p=>p.id!==v); toast(`${nm(v)} marked as used`); render(); },
  mode(v){ S.ful.mode=v; render(); }, slot(v){ S.ful.slot=v; render(); },
  confirmOrder(){ const mode=S.ful.mode==='drive'?C().drive:'Home delivery'; const fee=S.ful.mode==='delivery'?4.90*C().rate:0;
    S.lastOrder={id:'DM-'+(2418+S.orders.length),mode,slot:S.ful.slot||'Thu 18:00–18:30',items:S.list.map(l=>[l.p,l.q]),total:listTotal()+fee,sugg:suggestedValue(),demo:true};
    S.orders.unshift({id:S.lastOrder.id,when:'Upcoming · '+mode,items:S.lastOrder.items,demo:true});
    S.list.forEach(l=>{ if(S.ess[l.p]) S.ess[l.p].opened=-S.day+0; if(l.p==='detergentXL'){S.ess.detergent.opened=-S.day;S.ess.detergent.dur=56;} if(l.p==='soapRefill'){S.ess.soap.opened=-S.day;S.ess.soap.dur=42;} });
    S.list=[]; notify('Demo order confirmed',`${mode} · ${S.lastOrder.slot}. Nothing was ordered or paid.`,false); openSheet('confirmed'); advanceFor('order'); },
  readAll(){ S.notifs.forEach(n=>n.read=true); render(); },
  sampleNotif(){ notify('Dog food reminder','Your dog food may run out in 3 days. Add it to Thursday’s Drive?'); ui.sheet=ui.sheet==='presenter'?null:ui.sheet; render(); },
  pref(v){ S.prefs[v]=!S.prefs[v]; render(); },
  country(v){ S.country=v; S.startValue=S.startValue; toast(`Market: ${C().name} · prices in ${C().cur}`); render(); },
  redoSetup(){ S.onboarded=false; ui.onb=0; ui.sheet=null; render(); },
  resetProfile(){ if(!ui.confirmReset){ ui.confirmReset=true; render(); return; } A.reset(); },
  reset(){ const c=S.country; S=freshState(); S.country=c; S.startValue=listTotal(); Object.assign(ui,{sheet:null,plan:null,sel:{},cap:false,typing:false,q:'',cat:'all',onb:0,confirmReset:false}); ui.tab='today'; lastTab=null; render(); toast('Demo reset'); },
  ask(v){ ui.sheet=null; send(v); },
  sendq(){ const i=$('askq'); const v=i.value.trim(); if(v){ i.value=''; send(v);} },
  clearChat(){ S.chat=[]; S.topic=null; render(); },
  blkAdd(v){ const b=blk(v); b.done='added'; add(b.id,b.src); render(); },
  blkNo(v){ const b=blk(v); b.done='no'; toast('Okay, nothing added'); render(); },
  blkSel(v,e){ const s=ui.sel[v]; s[e.dataset.p]=!s[e.dataset.p]; render(); },
  blkAddSel(v){ const b=blk(v), ids=b.ids.filter(i=>ui.sel[v][i]); ids.forEach(i=>addItem(i,b.src)); b.done='added'; toast(`Added ${ids.length} · ${money(sum(ids))}`); render(); },
  missing(v,e){ const b=blk(v), p=e.dataset.p; b.done=p; S.orders[0].issue=p; S.topic='Missing item from order '+S.orders[0].id;
    S.chat.push({r:'u',t:`The ${nm(p).toLowerCase()} ${/s$/.test(nm(p))?'are':'is'} missing.`}); S.chat.push(aiMsg(`Thanks, I’ve noted the missing ${nm(p).toLowerCase()} (${money(pr(p))}). How would you like to resolve it?`,[{k:'resolve',p}])); render(); scrollChat(); advanceFor('missing'); },
  refund(v){ const b=blk(v); S.loyalty+=P[b.p].p; b.done=`${money(pr(b.p))} added to your loyalty balance (demo)`; S.chat.push(aiMsg('Done. The amount is on your loyalty balance for your next order. This is a demo, so no real money moved.')); notify('Refund added (demo)',`${money(pr(b.p))} credited to your loyalty balance.`,false); render(); scrollChat(); },
  handover(v){ const b=blk(v); b.done='yes'; S.chat.push({r:'sys',t:'Connecting you to customer service… · simulated advisor'}); render(); scrollChat(); advanceFor('handover');
    setTimeout(()=>{ const p=S.orders[0].issue; S.chat.push({r:'sys',t:'Camille joined the conversation'}); S.chat.push({r:'ag',t:`Hi Léa, I’m Camille. I’ve read the summary, so no need to repeat anything.${p?` I can confirm the ${nm(p).toLowerCase()} from order ${S.orders[0].id} and I’ve credited it to your loyalty balance.`:''} Is there anything else I can do?`});
      S.chat.push(aiMsg('For customers who write in their own language, advisors can work in theirs. Here’s an example:',[{k:'translate'}])); render(); scrollChat(); advanceFor('translate'); }, reduced()?50:1400); },
  store(){ S.storeOn=true; ui.sheet=null; ui.cap=false; render(); advanceFor('store'); },
  storeExit(){ S.storeOn=false; ui.sheet=null; render(); },
  scan(v){ openSheet('scan',v); },
  scanPick(v){ const l=inList(v); if(l) l.ck=1; else addItem(v,'Scanned',1,1); ui.sheet=null; toast(`Scanned ${nm(v)} · +${money(pr(v))}`); if(v==='buns'&&!S.storeSugg.buns) S.storeSugg.buns='open'; render(); advanceFor('scan:'+v); },
  basketScan(){ const n=S.list.filter(l=>!l.ck).length; S.list.forEach(l=>l.ck=1); if(inList('buns')&&!S.storeSugg.buns) S.storeSugg.buns='open'; ui.sheet=null; toast(`Station read ${n} items (simulated)`); render(); advanceFor('scan:basket'); },
  sugAcc(v){ S.storeSugg[v]='yes'; addItem(v,'In-store idea',1,1); toast(`Added ${nm(v)} · +${money(pr(v))}`); render(); advanceFor('add:'+v); },
  sugNo(v){ S.storeSugg[v]='no'; render(); },
  alt(v){ openSheet('alt',v); },
  altSwap(v){ const l=inList(v), b=ALT[v]; if(l){ l.p=b; } ui.sheet=null; toast(`Swapped to ${nm(b)}`); render(); },
  storeFinish(){ openSheet('storeDone'); advanceFor('storeFinish'); },
  scenario(v){ startScenario(v); },
  go(v){ const [k,...r]=v.split(':'); const a=r.join(':'); ({sheet:()=>openSheet(a),tab:()=>A.tab(a),ff:()=>A.ff(),store:()=>A.store(),scan:()=>{ if(!S.storeOn) A.store(); openSheet('scan',a); },ask:()=>A.ask(a),storeFinish:()=>A.storeFinish(),addPlan:()=>A.addPlan(),addEggs:()=>A.addEggs()})[k](); },
  onbGo(v){ ui.onb=+v; if(ui.onb>=6){ S.onboarded=true; ui.onb=0; if(S.startValue==null) S.startValue=listTotal(); toast('Household set up. Estimates ready.'); } render(); },
  hh(v,e){ const lim={adults:[1,6],kids:[0,6],laundry:[1,14]}[v]; S.hh[v]=Math.min(lim[1],Math.max(lim[0],S.hh[v]+ +e.dataset.d)); if(v==='laundry') S.ess.detergent.dur=Math.max(7,Math.round(16/S.hh.laundry)*7); render(); },
  hhSet(v,e){ let d=e.dataset.d; d=d==='true'?true:d==='false'?false:isNaN(+d)?d:+d; S.hh[v]=d; render(); },
  durStep(v,e){ S.ess[v].dur=Math.max(7,Math.min(70,S.ess[v].dur+ +e.dataset.d)); render(); },
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  const cap=$('capsule');
  if(!t){ if(e.target.closest('#capsule')&&!ui.cap){ ui.cap=true; render(); } else if(e.target.id==='scrim'){ ui.sheet=null; render(); } else if(ui.cap&&!e.target.closest('#capsule')){ ui.cap=false; render(); } return; }
  if(t.tagName==='SELECT'||t.type==='range') return;
  e.preventDefault();
  if(t.id==='banner') t.classList.remove('on');
  const fn=A[t.dataset.a]; if(fn) fn(t.dataset.v,t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(ui.sheet){ ui.sheet=null; render(); } else if(ui.cap){ ui.cap=false; render(); $('capsule').focus(); } return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'&&e.target.tagName!=='BUTTON'){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter'&&e.target.id==='askq'){ e.preventDefault(); A.sendq(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='shopq'){ ui.q=e.target.value; render(); }
  if(e.target.type==='range'&&e.target.dataset.a==='setDur'){ S.ess[e.target.dataset.v].dur=+e.target.value; $('durlbl').textContent=Math.round(e.target.value/7*10)/10+' weeks'; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='setOpened'){ S.ess[t.dataset.v].opened=+t.value; render(); }
  if(t.dataset.a==='setDur'){ render(); }
});
function layout(){ const m=innerWidth<=640||(matchMedia('(pointer:coarse)').matches&&innerWidth<900); document.documentElement.classList.toggle('is-mobile',m);
  if(!m){ const h=innerHeight-40, s=Math.min(1,h/852); $('phone').style.height=Math.min(852,h)+'px'; } else $('phone').style.height=''; }
addEventListener('resize',layout);
load(); if(S.startValue==null) S.startValue=listTotal(); S.storeOn=S.storeOn&&true; layout(); render();
</script>
