<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auchan Dayli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>html,body{margin:0}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{
  --red:#E1001A;--red-deep:#B00016;--red-soft:#FDEBED;--red-tint:#FFF5F6;
  --ink:#1D1A18;--ink2:#56504B;--ink3:#857E77;
  --bg:#F6F3EF;--card:#FFFFFF;--line:#EAE4DD;--line2:#DDD5CC;
  --green:#2A7A4B;--green-soft:#E5F1E9;--amber:#9A5A00;--amber-soft:#FBEFD9;--blue:#2F5E9E;--blue-soft:#E7EEF8;
  --glass:rgba(255,255,255,.66);--glass-line:rgba(255,255,255,.75);
  --stage:#EDE8E2;--stage-ink:#2A2522;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --shadow:0 1px 2px rgba(40,20,10,.05),0 6px 20px rgba(40,20,10,.06);
  --shadow-float:0 10px 40px rgba(40,20,10,.16),0 2px 6px rgba(40,20,10,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Onest","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage:#1B1817;--stage-ink:#EDE6E0;}}
:root[data-theme="dark"]{--stage:#1B1817;--stage-ink:#EDE6E0;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #2F5E9E;outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Stage & phone ---------- */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-inline:24px}
.phone{position:relative;width:393px;height:852px;max-height:calc(100vh - 40px);border-radius:58px;background:#111;padding:11px;box-shadow:0 0 0 2px #3a3634,0 0 0 5px #1a1817,0 40px 80px rgba(20,10,5,.35),inset 0 0 0 1px #000;flex:none}
.phone::before{content:"";position:absolute;right:-7px;top:190px;width:4px;height:90px;border-radius:0 3px 3px 0;background:#2a2624}
.phone::after{content:"";position:absolute;left:-7px;top:160px;width:4px;height:60px;border-radius:3px 0 0 3px;background:#2a2624;box-shadow:0 80px 0 #2a2624}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:47px;overflow:hidden;background:var(--bg);isolation:isolate}
.statusbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-weight:600;font-size:15px;z-index:40;pointer-events:none}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.app{position:absolute;inset:0;display:flex;flex-direction:column}
.is-mobile .stage{padding:0;gap:0}
.is-mobile .phone{width:100%;height:100%;max-height:none;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
.is-mobile .phone::before,.is-mobile .phone::after{display:none}
.is-mobile .screen-wrap{border-radius:0}
.is-mobile .statusbar{display:none}
.is-mobile body{background:var(--bg)}

/* ---------- Scroll area ---------- */
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;padding:108px 18px 128px;scroll-behavior:smooth;overscroll-behavior:contain}
.is-mobile .scroller{padding-top:calc(env(safe-area-inset-top,0px) + 76px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
.scroller::-webkit-scrollbar{width:0}
.scroller.ask{padding-bottom:190px}
.is-mobile .scroller.ask{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}

/* ---------- Top bar ---------- */
.topbar{position:absolute;top:50px;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none}
.is-mobile .topbar{top:calc(env(safe-area-inset-top,0px) + 12px)}
.topbar>*{pointer-events:auto}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 2px 10px rgba(40,20,10,.08);position:relative}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

/* ---------- Capsule (assistant island) ---------- */
.capsule{position:absolute;top:11px;left:50%;transform:translateX(-50%);z-index:45;background:#0E0D0D;color:#fff;border-radius:24px;width:212px;height:37px;display:flex;align-items:center;gap:8px;padding:0 6px 0 6px;transition:width .45s cubic-bezier(.3,1.3,.5,1),height .45s cubic-bezier(.3,1.3,.5,1),border-radius .45s;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.is-mobile .capsule{top:calc(env(safe-area-inset-top,0px) + 12px);width:min(210px,calc(100% - 132px))}
.capsule .cap-bird{width:28px;height:28px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.capsule .cap-bird svg{width:20px;height:20px}
.capsule .cap-text{flex:1;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.capsule .cap-pill{font-size:11px;background:rgba(255,255,255,.14);border-radius:12px;padding:3px 8px;flex:none}
.capsule.open{width:calc(100% - 20px);height:auto;border-radius:32px;flex-direction:column;align-items:stretch;padding:14px;gap:12px;background:rgba(18,16,16,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.is-mobile .capsule.open{width:calc(100% - 24px)}
.cap-head{display:flex;align-items:center;gap:10px}
.cap-head b{font-family:var(--f-display);font-size:16px;font-weight:600}
.cap-head small{display:block;color:#bdb5ae;font-size:12px}
.cap-list{display:flex;flex-direction:column;gap:6px}
.cap-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.08);border-radius:16px;text-align:left;font-size:13.5px;min-height:44px}
.cap-item:hover{background:rgba(255,255,255,.14)}
.cap-item .ci-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none;font-size:16px}
.cap-item span.go{margin-left:auto;color:#bdb5ae}
.cap-foot{display:flex;gap:8px}
.cap-foot>*{flex:1;border-radius:14px;padding:10px;font-size:13px;font-weight:600;min-height:44px}
.cap-ask{background:var(--red);color:#fff}
.cap-close{background:rgba(255,255,255,.12)}

/* ---------- Bird ---------- */
.bird{display:inline-block}
.bird .b-body{transform-origin:50% 70%;animation:bob 4.8s ease-in-out infinite}
.bird .b-eye{transform-origin:center;animation:blink 5.5s infinite}
.bird.thinking .b-body{animation:peck 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.5px) rotate(-3deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes peck{0%,100%{transform:rotate(0)}40%{transform:rotate(-10deg) translateY(1px)}}

/* ---------- Tab bar ---------- */
.tabbar{position:absolute;left:12px;right:12px;bottom:22px;z-index:30;height:70px;border-radius:30px;display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:center;background:rgba(255,255,255,.7);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow-float)}
.is-mobile .tabbar{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3);height:100%;justify-content:center;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--red)}
.tab .badge{position:absolute;top:10px;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.tab-ask{margin-top:-30px;gap:5px;color:var(--ink)}
.tab-ask .ask-orb{width:60px;height:60px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 8px 22px rgba(225,0,26,.35),0 0 0 5px rgba(255,255,255,.9);transition:transform .2s}
.tab-ask:hover .ask-orb{transform:translateY(-2px)}
.tab-ask .ask-orb svg{width:38px;height:38px}
.tab-ask.on{color:var(--red)}

/* ---------- Type & common ---------- */
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.h-xl{font-size:30px;line-height:1.08;font-weight:600}
.h-lg{font-size:22px;line-height:1.15;font-weight:600}
.h-md{font-size:17px;line-height:1.2;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink3)}
.muted{color:var(--ink2)}
.faint{color:var(--ink3);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.sec-head h2{font-size:18px;font-weight:600}
.link{color:var(--red);font-weight:600;font-size:13.5px;min-height:32px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--ink2);background:rgba(29,26,24,.06);border-radius:8px;padding:3px 7px}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);min-height:38px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;min-height:44px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:var(--red-deep)}
.btn-dark{background:var(--ink);color:#fff}
.btn-soft{background:var(--red-soft);color:var(--red-deep)}
.btn-ghost{background:rgba(29,26,24,.06);color:var(--ink)}
.btn-line{border:1.5px solid var(--line2);background:var(--card)}
.btn-sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:11px}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.low{background:var(--amber-soft);color:var(--amber)}
.pill.check{background:var(--red-soft);color:var(--red-deep)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.pill.neutral{background:rgba(29,26,24,.06);color:var(--ink2)}
.pill .pd{width:7px;height:7px;border-radius:50%;background:currentColor}
.why{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;gap:8px;line-height:1.4}
.why b{color:var(--ink)}
.divider{height:1px;background:var(--line);margin:4px 0}
.prod-img{border-radius:14px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.prod-img span{filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.qty{display:inline-flex;align-items:center;background:var(--bg);border-radius:12px;height:36px}
.qty button{width:36px;height:36px;display:grid;place-items:center;font-size:18px;font-weight:600;border-radius:12px}
.qty button:hover{background:var(--line)}
.qty span{min-width:22px;text-align:center;font-weight:600;font-size:14px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.strike{text-decoration:line-through;color:var(--ink3);font-weight:500;font-size:12px}
.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .5s}
.progress.warn>i{background:var(--amber)}
.progress.over>i{background:var(--red)}

/* ---------- Today ---------- */
.hello{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hello .date{font-size:13px;color:var(--ink3);font-weight:500}
.hh-strip{display:flex;gap:8px;flex-wrap:wrap}
.hh-strip .pill{background:var(--card);border:1px solid var(--line);color:var(--ink2);padding:5px 10px}
.reco{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.anim{animation:rise .4s ease both}
.reco-top{display:flex;gap:12px;padding:16px 16px 12px;align-items:flex-start;text-align:left;width:100%}
.reco-top .prod-img{width:52px;height:52px;font-size:28px}
.reco h3{font-size:16.5px;font-weight:600;line-height:1.25}
.reco p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.reco-actions{display:flex;gap:5px;padding:0 16px 14px}
.reco-actions .btn-main{flex:1;padding-inline:8px;font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.reco-kind{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.reco.lead{background:linear-gradient(160deg,#1E1A19,#2A2320);color:#fff}
.reco.lead p{color:#D5CCC5}
.reco.lead .btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.reco.lead .reco-kind{color:#FF9AA5}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.snoozed{font-size:12.5px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px dashed var(--line2);border-radius:14px}
.budget-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.ring{width:64px;height:64px}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px;font-size:14.5px}
.msg.ai{align-self:flex-start;display:flex;gap:8px;max-width:100%;width:100%}
.msg.ai .av{width:30px;height:30px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none;margin-top:2px}
.msg.ai .av svg{width:22px;height:22px}
.msg.ai .bubble{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.msg.ai .txt{background:var(--card);border-radius:6px 20px 20px 20px;padding:11px 14px;box-shadow:var(--shadow);font-size:14.5px;align-self:flex-start}
.msg.sys{align-self:center;font-size:12px;color:var(--ink3);text-align:center;max-width:90%}
.msg.agent .av{background:var(--blue)}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink3);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 14px;font-size:14px;font-weight:500;min-height:48px}
.suggest button:hover{border-color:var(--red)}
.suggest .s-ico{width:30px;height:30px;border-radius:10px;background:var(--red-tint);display:grid;place-items:center;font-size:16px;flex:none}
.composer{position:absolute;left:12px;right:12px;bottom:104px;z-index:29;display:flex;gap:8px;align-items:center;padding:6px 6px 6px 16px;border-radius:26px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-float)}
.is-mobile .composer{bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
.composer input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0;padding:8px 0}
.composer .send{width:40px;height:40px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{white-space:nowrap;font-size:12.5px;font-weight:600;border-radius:12px;padding:7px 11px;background:var(--red-tint);color:var(--red-deep);border:1px solid #F8D4D9;min-height:34px}
.rich{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}

/* ---------- Product tiles ---------- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ptile{background:var(--card);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.ptile .prod-img{width:100%;aspect-ratio:1.25;font-size:44px}
.ptile .pname{font-size:13px;font-weight:600;line-height:1.25;min-height:32px}
.ptile .punit{font-size:11.5px;color:var(--ink3)}
.ptile .addbtn{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center;font-size:20px;font-weight:600;color:var(--red)}
.ptile .addbtn.in{background:var(--red);color:#fff}
.offer-flag{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:7px;padding:3px 6px;z-index:1}
.pmini{flex:none;width:148px;background:var(--bg);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent;text-align:left}
.pmini.sel{border-color:var(--red);background:var(--red-tint)}
.pmini .prod-img{width:100%;height:78px;font-size:38px}
.pmini b{font-size:13px;line-height:1.25}
.line-item{display:flex;align-items:center;gap:12px;padding:10px 0}
.line-item+.line-item{border-top:1px solid var(--line)}
.line-item .prod-img{width:46px;height:46px;font-size:24px;border-radius:12px}
.line-item .li-main{flex:1;min-width:0}
.line-item .li-name{font-weight:600;font-size:14px;line-height:1.25}
.line-item .li-sub{font-size:12px;color:var(--ink3)}
.line-item.done .li-name{text-decoration:line-through;color:var(--ink3)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;color:#fff}
.check.on{background:var(--green);border-color:var(--green)}
.src{font-size:10.5px;font-weight:600;color:var(--red-deep);background:var(--red-tint);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}

/* ---------- Meals ---------- */
.meal{display:flex;gap:12px;align-items:center;padding:10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.meal-img{width:78px;height:78px;border-radius:14px;display:grid;place-items:center;font-size:36px;flex:none;position:relative;overflow:hidden}
.meal-img::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 60%)}
.meal .day{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.meal b{font-size:14.5px;line-height:1.25;display:block}
.meal .meta{font-size:12px;color:var(--ink3)}
.meal-hero{height:150px;border-radius:18px;display:grid;place-items:center;font-size:72px;position:relative;overflow:hidden}
.recipe-card{flex:none;width:210px;background:var(--bg);border-radius:16px;overflow:hidden}
.recipe-card .meal-img{width:100%;height:96px;border-radius:0;font-size:44px}
.recipe-card .rc-b{padding:10px 12px;display:flex;flex-direction:column;gap:4px}

/* ---------- Home ---------- */
.ess{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.ess-top{display:flex;gap:12px;align-items:center}
.ess-top .prod-img{width:48px;height:48px;font-size:26px}
.gauge{height:10px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.pantry{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pan{background:var(--card);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);text-align:left}
.pan .prod-img{width:38px;height:38px;font-size:22px;border-radius:10px}
.pan b{font-size:13.5px;display:block;line-height:1.2}
.pan small{font-size:11.5px;color:var(--ink3)}

/* ---------- Sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(20,12,8,.32);z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:88%;display:flex;flex-direction:column;border-radius:32px 32px 0 0;background:rgba(252,250,248,.9);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -10px 40px rgba(20,10,5,.18);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.sheet.on{transform:none}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px;gap:10px;flex:none}
.sheet-head h2{font-size:20px;font-weight:600}
.sheet-close{width:36px;height:36px;border-radius:50%;background:rgba(29,26,24,.07);display:grid;place-items:center;flex:none}
.sheet-body{overflow-y:auto;padding:8px 20px 30px;display:flex;flex-direction:column;gap:14px}
.is-mobile .sheet-body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.full{position:absolute;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1)}
.full.on{transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2)}
.seg{display:flex;background:rgba(29,26,24,.06);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;color:var(--ink2);min-height:38px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;min-height:52px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow b{font-size:14px;font-weight:600;display:block}
.setrow small{color:var(--ink3);font-size:12px}
input[type=range]{width:100%;accent-color:var(--red)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:600}
.stepper span{font-family:var(--f-display);font-size:22px;font-weight:600;min-width:28px;text-align:center}

/* ---------- Toast / banner ---------- */
.banner{position:absolute;top:56px;left:10px;right:10px;z-index:70;background:rgba(250,248,246,.9);backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border-radius:24px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:var(--shadow-float);transform:translateY(calc(-100% - 90px));visibility:hidden;transition:transform .45s cubic-bezier(.2,1.2,.4,1),visibility 0s .45s;text-align:left}
.is-mobile .banner{top:calc(env(safe-area-inset-top,0px) + 8px)}
.banner.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
.btn-ico{width:34px;padding:0;flex:none}.btn-ico svg{width:17px;height:17px}
.banner .b-app{width:38px;height:38px;border-radius:10px;background:var(--red);display:grid;place-items:center;flex:none}
.banner .b-app svg{width:28px;height:28px}
.banner b{font-size:13.5px;display:block}
.banner small{font-size:13px;color:var(--ink2);display:block;line-height:1.3}
.toast{position:absolute;left:50%;bottom:108px;transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;font-size:13.5px;font-weight:500;opacity:0;transition:all .3s;pointer-events:none;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- Store mode ---------- */
.store{background:#15120F;color:#fff}
.store .scroller{padding-top:100px;padding-bottom:40px}
.store-head{position:absolute;top:50px;left:0;right:0;z-index:5;padding:0 16px;display:flex;justify-content:space-between;align-items:center}
.is-mobile .store-head{top:calc(env(safe-area-inset-top,0px) + 12px)}
.store .card,.store .rich{background:#221E1B;box-shadow:none;color:#fff}
.store .muted,.store .faint,.store .line-item .li-sub{color:#B7AEA6}
.store .line-item+.line-item{border-top-color:#35302C}
.store .progress{background:#35302C}
.store .btn-ghost{background:rgba(255,255,255,.1);color:#fff}
.store .why{background:#2C2724;color:#D8D0C9}.store .why b{color:#fff}
.store .iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14);color:#fff}
.scanbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scanbar button{background:#221E1B;border:1px solid #3A3430;border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-height:92px;position:relative}
.scanbar button:hover{border-color:var(--red)}
.scanbar .sb-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(225,0,26,.18);color:#FF8A96}
.scanbar .sb-ico svg{width:22px;height:22px}
.tagf{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:2px 5px;font-weight:700}
.tagf.mvp{background:var(--green-soft);color:var(--green)}
.tagf.fut{background:#EDE4F7;color:#5B3B87}
.scan-stage{height:230px;border-radius:22px;background:#0A0908;position:relative;display:grid;place-items:center;overflow:hidden}
.nfc-ring{width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;position:relative}
.nfc-ring::before,.nfc-ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--red);animation:pulse 1.8s infinite;opacity:0}
.nfc-ring::after{animation-delay:.9s}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.viewfinder{position:absolute;inset:34px;border-radius:18px}
.viewfinder::before{content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.7);border-radius:18px;-webkit-mask:linear-gradient(#000 0 0) top/100% 22px no-repeat,linear-gradient(#000 0 0) bottom/100% 22px no-repeat;mask:linear-gradient(#000 0 0) top/100% 22px no-repeat,linear-gradient(#000 0 0) bottom/100% 22px no-repeat}
.scanline{position:absolute;left:10%;right:10%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:scan 1.6s ease-in-out infinite alternate;top:20%}
@keyframes scan{to{top:80%}}

/* ---------- Onboarding ---------- */
.onb{position:absolute;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding:70px 22px 34px}
.is-mobile .onb{padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.onb-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-bottom:12px}
.onb-steps{display:flex;gap:5px}
.onb-steps i{flex:1;height:4px;border-radius:2px;background:var(--line2)}
.onb-steps i.on{background:var(--red)}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.opt.on{border-color:var(--red);background:var(--red-tint)}
.opt b{font-size:14.5px}
.opt small{font-size:12px;color:var(--ink3)}
.opt .oi{font-size:22px}

/* ---------- Presenter panel ---------- */
.presenter{width:320px;max-height:calc(100vh - 40px);overflow-y:auto;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px;color:var(--ink);flex:none;scrollbar-width:thin}
.presenter h3{font-size:15px;font-weight:600}
.pr-brand{display:flex;gap:10px;align-items:center}
.pr-brand .pb{width:38px;height:38px;border-radius:12px;background:var(--red);display:grid;place-items:center}
.pr-brand .pb svg{width:28px;height:28px}
.pr-brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.pr-brand small{font-size:11.5px;color:var(--ink2)}
.scen{display:flex;flex-direction:column;gap:6px}
.scen button.sc{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;background:#fff;border:1.5px solid transparent;font-size:13.5px;font-weight:600;min-height:48px}
.scen button.sc.on{border-color:var(--red)}
.scen button.sc .n{width:24px;height:24px;border-radius:8px;background:var(--red-soft);color:var(--red-deep);display:grid;place-items:center;font-size:12px;flex:none}
.guide{background:#fff;border-radius:16px;padding:12px 14px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.guide ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.guide li.done{color:var(--ink3);text-decoration:line-through}
.guide li.now{font-weight:600}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;background:#fff;border-radius:16px;padding:12px 14px}
.metric b{font-variant-numeric:tabular-nums;text-align:right}
.metric .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.pr-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr-ctrl .btn{font-size:12.5px;padding:9px 8px}
.pr-note{font-size:11.5px;color:var(--ink2);line-height:1.4}
.demo-fab{display:none}
.is-mobile .presenter{display:none}
.is-mobile .demo-fab{display:flex}
.presenter-sheet .presenter{display:flex;width:auto;max-height:none;background:none;border:0;padding:0;backdrop-filter:none}
.university{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink3);z-index:31;pointer-events:none;letter-spacing:.02em}
.is-mobile .university{bottom:calc(env(safe-area-inset-bottom,0px) + 0px)}
.home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:50;pointer-events:none}
.is-mobile .home-ind{display:none}
@media (max-width:1100px){.presenter{width:280px}}
@media (max-width:820px){.presenter{display:none}.demo-fab{display:grid}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>

</head>

<div class="stage" id="stage">

      <div id="onb"></div>
      <div class="home-ind"></div>
    </div>
  </div>
</div>
<script>
"use strict";
/* ================= ICONS & BIRD ================= */
const I = {

/* The bird: a refined reinterpretation of the Auchan bird (unofficial concept). */
function bird(size=24, fill='#fff', eye='#E1001A', cls=''){

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function money(v){ const c=C(); const r=Math.round(v*100)/100; const s=Number.isInteger(r)&&r>=20?String(r):r.toFixed(2); return c.cur==='zł'? s.replace('.',',')+' zł' : (S.country==='FR'||S.country==='ES'? '€'+s : s); }

function tile(id,size){ const a=AISLES[P[id].a]; return `<div class="prod-img" style="background:${a.t}${size?';width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*.55)+'px':''}"><span>${P[id].e}</span></div>`; }
const inList=id=>S.list.find(l=>l.p===id);
const listTotal=()=>S.list.reduce((s,l)=>s+pr(l.p)*l.q,0);
const isEss=id=>['household','pets'].includes(P[id].a);
const foodTotal=()=>S.list.filter(l=>!isEss(l.p)).reduce((s,l)=>s+pr(l.p)*l.q,0);
const essTotal=()=>listTotal()-foodTotal();
const suggestedValue=()=>S.list.filter(l=>l.src).reduce((s,l)=>s+pr(l.p)*l.q,0);
const budget=()=>C().budget;
function remaining(id){ const e=S.ess[id]; return Math.max(0,e.dur-e.opened-S.day); }
function essState(id){ const r=remaining(id); if(r<=4) return ['check','Time to check']; if(r<=10) return ['low','Running low']; return ['ok','Enough for now']; }
function daysTxt(d){ if(d<=0) return 'may already be empty'; if(d===1) return 'about 1 day'; if(d<7) return `about ${d} days`; const w=Math.round(d/7); return `about ${w} week${w>1?'s':''}`; }
function dateIn(d){ const base=new Date(2026,8,25); base.setDate(base.getDate()+S.day+d); return base.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
function addItem(id,src,q=1,ck=0){
  const l=inList(id);
  if(l){ l.q+=q; if(src&&!l.src) l.src=src; if(ck) l.ck=1; }
  else S.list.push({p:id,q,ck:ck?1:0,src:src||null});

function notify(title,body,show=true){ S.notifs.unshift({id:'n'+Date.now()+Math.random(),title,body,t:'Just now',read:false}); if(show) banner(title,body); }
function planMeals(){ return (S.plan&&S.plan.meals)||DEFAULT_PLAN; }
function atHome(id){ return S.pantry.some(x=>x.id===id); }
function planMissing(meals){
  const need=[...new Set(meals.flatMap(m=>MEALS[m].ing))];
  return { home:need.filter(atHome), inl:need.filter(i=>!atHome(i)&&inList(i)), miss:need.filter(i=>!atHome(i)&&!inList(i)) };
}
function mealCost(m){ return MEALS[m].ing.filter(i=>!atHome(i)).reduce((s,i)=>s+pr(i),0); }
function sum(ids){ return ids.reduce((s,i)=>s+pr(i),0); }

/* ================= MY HOME ================= */
function essCard(id){

   <div class="gauge" role="img" aria-label="Estimated ${pct}% remaining"><i style="width:${pct}%;background:${col}"></i></div>
   <p style="margin:0;font-size:13.5px">Based on your usual purchases, your ${ESS_DEF[id].label.toLowerCase()} may last ${r<=0?'— it may already be empty':daysTxt(r).replace('about','another')}. <span class="faint">Refill around ${dateIn(r)}.</span></p>

}
function renderHome(){
  const ids=Object.keys(S.ess).filter(id=>id!=='dogfood'||S.hh.dog);
  const pan=[...S.pantry].sort((a,b)=>(a.exp??99)-(b.exp??99));

  <section class="stack"><div class="sec-head"><h2>Household essentials</h2><button class="link" data-a="ff">Fast-forward 2 weeks</button></div>${ids.map(essCard).join('')}</section>

   <div class="pantry">${pan.map(x=>{ const soon=x.exp!=null&&x.exp-S.day<=2; const d=x.exp==null?null:x.exp-S.day;
    return `<button class="pan" data-a="sheet" data-v="pantry">${tile(x.id,38)}<div><b>${nm(x.id)}</b><small>${esc(x.q)}</small><br>${d==null?'<small>No date</small>':`<span class="pill ${soon?'check':d<=5?'low':'ok'}" style="margin-top:4px">${d<=0?'Check today':d===1?'Use by tomorrow':'Use within '+d+' days'}</span>`}</div></button>`;}).join('')}</div>
   ${atHome('spinach')?`<button class="btn btn-soft btn-block" data-a="sheet" data-v="recipe">Cook the spinach tonight</button>`:''}</section>

   <div class="faint">${S.hh.adults} adults · ${S.hh.dog?'1 dog · ':''}${S.hh.laundry} laundry loads/week · cooks ${({most:'most evenings',some:'a few evenings',rare:'rarely'})[S.hh.cooking]} · max ${S.hh.prep} min</div></section></div>`;
}

/* ================= MY LIST ================= */

function byAisle(items){ return AISLE_ORDER.map(a=>[a,items.filter(l=>P[l.p].a===a)]).filter(x=>x[1].length); }
function budgetBar(){
  const f=foodTotal(), b=budget(), p=Math.min(100,f/b*100);
  return `<div class="stack" style="gap:6px"><div class="between"><span class="eyebrow">Food budget</span><span class="num" style="font-size:13px;font-weight:600">${money(f)} / ${money(b)}</span></div>
   <div class="progress ${f>b?'over':p>85?'warn':''}"><i style="width:${p}%"></i></div>
   <span class="faint">${f>b?`${money(f-b)} over your budget. Review optional items below.`:`${money(b-f)} left for this week’s food.`}</span></div>`;
}
function renderList(){
  const items=S.list, n=items.length, done=items.filter(l=>l.ck).length;
  const exp=!inList('cheese')&&!inList('salad')&&inList('pasta')&&inList('tomsauce')&&!S.dismissed.expand;
  return `<div class="stack-lg"><section class="hello"><div class="between"><h1 class="h-xl">My List</h1><span class="demo-tag">Demo prices</span></div>
   <p class="muted" style="margin:0">${n} item${n!==1?'s':''} · ${done} checked off · grouped by aisle</p></section>
  <section class="card stack">${budgetBar()}</section>
  ${S.plan&&S.plan.added?`<button class="card between" data-a="sheet" data-v="plan" style="text-align:left"><div class="row">${planMeals().slice(0,3).map(m=>`<span style="font-size:22px">${MEALS[m].e}</span>`).join('')}<div><b>5-dinner plan</b><div class="faint">Ingredients added from your plan</div></div></div><span class="link">Edit plan</span></button>`:''}
  ${exp?`<div class="card stack" style="gap:10px"><div class="row">${bird(28,'#E1001A','#fff')}<b style="flex:1">Make it a complete dinner with grated cheese and a side salad.</b></div><button class="btn btn-sm btn-dark" data-a="ask" data-v="Complete my pasta dinner">See options · ${money(pr('cheese')+pr('salad'))}</button></div>`:''}
  ${n?byAisle(items).map(([a,ls])=>`<section class="card" style="padding:6px 14px"><div class="eyebrow" style="padding-top:10px">${AISLES[a].n}</div>${ls.map(l=>lineItem(l)).join('')}</section>`).join(''):`<div class="card faint">Your list is empty. Ask Auchan to plan your week, or browse Shop.</div>`}
  <section class="card stack" style="gap:8px"><div class="between"><span class="muted">Food</span><b class="num">${money(foodTotal())}</b></div><div class="between"><span class="muted">Household & pets</span><b class="num">${money(essTotal())}</b></div><div class="divider"></div><div class="between"><b>Estimated total</b><b class="num" style="font-size:20px;font-family:var(--f-display)">${money(listTotal())}</b></div><span class="faint">Demo prices and offers from a fixed fictional catalog.</span></section>
  <div class="stack" style="gap:8px"><button class="btn btn-red btn-block" data-a="sheet" data-v="checkout" ${n?'':'disabled'}>Choose Drive or delivery</button><button class="btn btn-line btn-block" data-a="store">${I.store} Shop this list in store</button></div></div>`;
}

<script>
/* ================= SHOP ================= */
const CATS=[['all','All'],['offers','Offers'],['produce','Fresh produce'],['dairy','Dairy & eggs'],['meat','Meat & fish'],['pantry','Pantry'],['bakery','Bakery'],['drinks','Drinks'],['household','Household'],['pets','Pets']];

  <button class="card row" data-a="sheet" data-v="checkout" style="text-align:left;gap:12px"><div class="prod-img" style="width:46px;height:46px;background:var(--red-soft);font-size:24px"><span>🚗</span></div><div style="flex:1"><b>${C().drive} or home delivery</b><div class="faint">Next free slot suggested by Dayli · ${C().store}</div></div><span class="link">Slots</span></button>`:''}

/* ================= SHEETS ================= */
function sheetFrame(title,body,back){ return `<div class="sheet-grab"></div><div class="sheet-head">${back?`<button class="sheet-close" data-a="sheet" data-v="${back}" aria-label="Back">${I.back}</button>`:''}<h2 id="sheet-title" style="flex:1">${title}</h2><button class="sheet-close" data-a="closeSheet" aria-label="Close">${I.close}</button></div><div class="sheet-body">${body}</div>`; }
function whyBox(t){ return `<div class="why">${I.info}<span><b>Why this suggestion?</b> ${t}</span></div>`; }
function mealShare(meals){ const cnt={}; meals.forEach(m=>MEALS[m].ing.forEach(i=>{ if(!atHome(i)) cnt[i]=(cnt[i]||0)+1; })); return m=>MEALS[m].ing.filter(i=>!atHome(i)).reduce((s,i)=>s+pr(i)/cnt[i],0); }
const SHEETS = {
  plan(){

     <div class="row" style="flex-wrap:wrap;gap:6px"><span class="pill neutral">${servings} servings each</span><span class="pill neutral">≤ ${S.hh.prep} min</span><span class="pill neutral">Budget ${money(budget())}</span><span class="pill ok">Uses what you have</span></div>
     <div class="stack" style="gap:10px">${meals.map((m,i)=>`<div class="meal"><div class="meal-img" style="background:${MEALS[m].t}">${MEALS[m].e}</div><div style="flex:1;min-width:0"><div class="day">${DAYS[i]}</div><b>${MEALS[m].n}</b><div class="meta">${MEALS[m].min} min · ${servings} servings · ~${money(cost(m))} to buy</div></div><button class="btn btn-sm btn-ghost" data-a="swap" data-v="${i}" aria-label="Swap ${MEALS[m].n}">Swap</button></div>`).join('')}</div>
     <div class="card stack" style="gap:10px"><b>Already at home</b><div class="row" style="flex-wrap:wrap;gap:6px">${home.map(i=>`<span class="pill ok">✓ ${nm(i)}</span>`).join('')||'<span class="faint">Nothing matched.</span>'}</div>
      ${inl.length?`<b>Already in your list</b><div class="row" style="flex-wrap:wrap;gap:6px">${inl.map(i=>`<span class="pill info">${nm(i)}</span>`).join('')}</div>`:''}
      <div class="divider"></div><div class="between"><b>Missing ingredients</b><span class="faint">${miss.length} items</span></div>
      ${miss.map(i=>`<div class="between" style="font-size:14px"><span class="row" style="gap:8px">${tile(i,30)}${nm(i)}</span><span class="num">${money(pr(i))}</span></div>`).join('')||'<span class="faint">Everything is covered.</span>'}
      <div class="divider"></div><div class="between"><span class="muted">Estimated plan cost</span><b class="num">${money(plan)}</b></div><div class="between"><span class="muted">Food list after adding</span><b class="num">${money(foodTotal()+total)} / ${money(budget())}</b></div></div>
     ${whyBox('Five quick dinners for your household, built around the rice, onions and spinach you have. Shared items like lemons and cheese are counted once.')}
     <div class="stack" style="gap:8px">${miss.length?`<button class="btn btn-red btn-block" data-a="addPlan">Add ${miss.length} missing ingredients · ${money(total)}</button>`:`<button class="btn btn-red btn-block" data-a="addPlan">Save this plan</button>`}
     <button class="btn btn-ghost btn-block" data-a="regen">Regenerate plan</button></div>`);
  },
  recipe(){

     <div class="card" style="padding:6px 14px">${ing.map(i=>`<div class="line-item">${tile(i)}<div class="li-main"><div class="li-name">${nm(i)}</div><div class="li-sub">${atHome(i)?'At home':inList(i)?'In your list':'Missing'}</div></div>${atHome(i)||inList(i)?'<span class="pill ok">✓</span>':`<span class="price">${money(pr(i))}</span>`}</div>`).join('')}</div>
     ${whyBox('Your spinach is best within a day. This recipe uses the whole bag and takes 20 minutes.')}
     ${miss.length?`<button class="btn btn-red btn-block" data-a="addMany" data-v="${miss.join(',')}" data-src="Recipe">Add ${miss.length} missing · ${money(sum(miss))}</button>`:`<button class="btn btn-dark btn-block" data-a="cooked">I cooked it · remove spinach from Use soon</button>`}
     <p class="faint" style="margin:0">Steps: cook penne 11 min. Soften garlic in a pan, add cream and spinach until wilted, stir in pasta and cheese.</p>`);

    return sheetFrame('Refill your detergent',`<p class="muted" style="margin:0">At ${w} loads a week (your setting), here’s how the formats compare.</p>
     <div class="row" style="align-items:stretch">${opt('detergent',ua,Math.round(a.per/w),0)}${opt('detergentXL',ub,Math.round(b.per/w),1)}</div>
     <div class="card stack" style="gap:6px"><b>Larger format: what changes</b><div class="between"><span class="muted">Today’s order</span><b class="num">+${money(pr('detergentXL')-pr('detergent'))} vs usual bottle</b></div><div class="between"><span class="muted">Cost per load</span><b class="num">${money(ua)} → ${money(ub)}</b></div><div class="between"><span class="muted">Next refill</span><b>in ≈ ${Math.round(b.per/w)} weeks instead of ${Math.round(a.per/w)}</b></div></div>

     <div class="card between"><div><div class="eyebrow">Estimated refill date</div><b>${r<=0?'Now':dateIn(r)}</b></div><span class="pill ${essState(id)[0]}">${essState(id)[1]}</span></div>

     <button class="btn btn-dark btn-block" data-a="closeSheet">Save estimate</button>`,ui.back);
  },
  pantry(){
    return sheetFrame('Food at home',`<p class="muted" style="margin:0">Items you confirmed or that come from simulated purchases. Correct anything that’s off.</p>
     <div class="card" style="padding:6px 14px">${S.pantry.map(x=>`<div class="line-item">${tile(x.id)}<div class="li-main"><div class="li-name">${nm(x.id)}</div><div class="li-sub">${esc(x.q)} · ${esc(x.src)}${x.exp!=null?` · use within ${Math.max(0,x.exp-S.day)} d`:''}</div></div>${x.exp!=null?`<span class="qty"><button data-a="exp" data-v="${x.id}" data-d="-1" aria-label="Sooner">−</button><span class="num">${Math.max(0,x.exp-S.day)}d</span><button data-a="exp" data-v="${x.id}" data-d="1" aria-label="Later">+</button></span>`:''}<button class="btn btn-sm btn-ghost" data-a="usedUp" data-v="${x.id}">Used</button></div>`).join('')}</div>`);
  },
  checkout(){
    const mode=S.ful.mode, slots=[['Thu','18:00–18:30',1,1],['Thu','19:00–19:30',1],['Fri','12:30–13:00',1],['Fri','18:00–18:30',0],['Sat','10:00–10:30',1],['Sat','11:00–11:30',0]];
    const fee=mode==='delivery'?4.90*C().rate:0, dogNeed=S.hh.dog&&remaining('dogfood')<=10&&!inList('dogfood')&&!S.dismissed.dogCheckout;
    const sel=S.ful.slot||'Thu 18:00–18:30';
    return sheetFrame('Drive, delivery or store',`<div class="seg" role="tablist">${[['drive',C().drive],['delivery','Home delivery'],['store','In store']].map(([k,v])=>`<button class="${mode===k?'on':''}" data-a="mode" data-v="${k}" role="tab" aria-selected="${mode===k}">${v}</button>`).join('')}</div>
     <div class="card stack" style="gap:10px;border:1.5px solid var(--red)"><div class="row">${bird(30,'#E1001A','#fff')}<b style="flex:1">Suggested: ${mode==='store'?'Thursday after 18:00 in store':`Thursday 18:00–18:30 ${mode==='drive'?'pickup':'delivery'}`}</b></div>
      <div class="why"><span><b>Why?</b> You usually shop on Thursdays, this slot shows good availability (simulated), and it arrives before your dog food is estimated to run low. ${mode==='drive'?'Drive pickup is free in this demo and takes about 5 minutes.':mode==='delivery'?'Delivery adds a demo fee of '+money(4.90*C().rate)+'.':'Store traffic is usually lighter after 18:00 (simulated).'}</span></div></div>
     ${mode==='store'?`<button class="btn btn-red btn-block" data-a="store">${I.store} Start in-store mode</button>`:`
     <div class="field"><label>Available slots (simulated)</label><div class="opt-grid" style="grid-template-columns:1fr 1fr 1fr">${slots.map(s=>{const k=s[0]+' '+s[1];return `<button class="opt ${sel===k?'on':''}" style="min-height:64px;padding:10px;${s[2]?'':'opacity:.45'}" ${s[2]?`data-a="slot" data-v="${k}"`:'disabled aria-disabled="true"'}><b style="font-size:13px">${s[0]}${s[3]?' ★':''}</b><small class="num">${s[1]}</small><small>${s[2]?'Available':'Full'}</small></button>`;}).join('')}</div></div>
     ${dogNeed?`<div class="card stack" style="gap:10px"><div class="row">${tile('dogfood',44)}<b style="flex:1">Your dog food is estimated to run low next week. Add your usual bag to this order?</b></div><div class="btn-row"><button class="btn btn-sm btn-dark" data-a="addDog">Add to order · ${money(pr('dogfood'))}</button><button class="btn btn-sm btn-ghost" data-a="dismiss" data-v="dogCheckout">Not yet</button></div></div>`:''}
     <div class="card stack" style="gap:8px"><div class="between"><span class="muted">${S.list.reduce((s,l)=>s+l.q,0)} items</span><b class="num">${money(listTotal())}</b></div><div class="between"><span class="muted">${mode==='drive'?'Pickup':'Delivery'} fee (demo)</span><b class="num">${fee?money(fee):'Free'}</b></div><div class="divider"></div><div class="between"><b>Estimated total</b><b class="num" style="font-size:19px">${money(listTotal()+fee)}</b></div></div>
     <button class="btn btn-red btn-block" data-a="confirmOrder" ${S.list.length?'':'disabled'}>Place demo order · ${sel}</button><p class="faint" style="margin:0;text-align:center">Demo only: nothing is ordered or paid.</p>`}`);
  },
  confirmed(){
    const o=S.lastOrder;
    return sheetFrame('Demo order confirmed',`<div style="display:grid;place-items:center;gap:10px;text-align:center;padding:10px 0"><div style="width:84px;height:84px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center">${bird(56,'#E1001A','#fff')}</div><h3 class="h-lg">You’re all set.</h3><p class="muted" style="margin:0">${o.mode} · ${o.slot}<br>${C().store}</p><span class="pill check">DEMO ORDER · not a real purchase</span></div>
     <div class="card" style="padding:6px 14px">${o.items.map(([p,q])=>`<div class="line-item">${tile(p)}<div class="li-main"><div class="li-name">${nm(p)}</div><div class="li-sub">× ${q}</div></div><span class="price">${money(pr(p)*q)}</span></div>`).join('')}</div>
     <div class="card between"><b>Total (demo)</b><b class="num" style="font-size:19px">${money(o.total)}</b></div>
     <p class="faint" style="margin:0">Order ${o.id}. I’ll send a reminder preview before your slot.</p><button class="btn btn-dark btn-block" data-a="closeSheet">Done</button>`);
  },
  notifs(){
    return sheetFrame('Notifications',`<p class="faint" style="margin:0">In-app previews only. This demo never sends push notifications.</p>
     <div class="stack" style="gap:8px">${S.notifs.map(n=>`<div class="card row" style="align-items:flex-start;padding:12px 14px;${n.read?'opacity:.7':''}"><span style="width:34px;height:34px;border-radius:10px;background:var(--red);display:grid;place-items:center;flex:none">${bird(24)}</span><div style="flex:1"><div class="between"><b style="font-size:14px">${esc(n.title)}</b><span class="faint">${n.t}</span></div><div style="font-size:13.5px" class="muted">${esc(n.body)}</div></div></div>`).join('')}</div>
     <div class="btn-row"><button class="btn btn-ghost" style="flex:1" data-a="readAll">Mark all read</button><button class="btn btn-dark" style="flex:1" data-a="sampleNotif">Preview a reminder</button></div>`);
  },
  settings(){
    const t=(k,l,d)=>`<div class="setrow"><div><b>${l}</b><small>${d}</small></div><button class="toggle ${S.prefs[k]?'on':''}" data-a="pref" data-v="${k}" role="switch" aria-checked="${S.prefs[k]}" aria-label="${l}"></button></div>`;
    return sheetFrame('You & your data',`
     <div class="card" style="padding:4px 16px">${t('personal','Personalized suggestions','Use your household profile to tailor ideas')}${t('history','Use purchase history','Simulated history drives stock estimates')}${t('reminders','Replenishment reminders','In-app previews for essentials')}${t('offers','Relevant offers','Only for items you buy or plan to cook')}${t('quiet','Quiet hours','No reminders 21:00–08:00')}</div>
     <div class="field"><label>International demo</label><div class="seg">${Object.keys(COUNTRIES).map(k=>`<button class="${S.country===k?'on':''}" data-a="country" data-v="${k}">${COUNTRIES[k].name}</button>`).join('')}</div><span class="faint">Adapts sample products, currency and fulfilment. The interface stays in English.</span></div>
     <div class="card stack" style="gap:8px"><b>Stored household data (simulated)</b>
      <div class="between faint"><span>Household</span><span>${S.hh.adults} adults, ${S.hh.kids} children${S.hh.dog?', 1 dog':''}</span></div>
      <div class="between faint"><span>Laundry</span><span>${S.hh.laundry} loads/week</span></div>
      <div class="between faint"><span>Essentials estimates</span><span>${Object.keys(S.ess).length} items</span></div>
      <div class="between faint"><span>Food at home</span><span>${S.pantry.length} items</span></div>
      <div class="between faint"><span>Chat messages</span><span>${S.chat.length}</span></div>
      <div class="between faint"><span>Stored where</span><span>This browser only</span></div>
      <div class="btn-row"><button class="btn btn-sm btn-ghost" data-a="redoSetup">Redo household setup</button><button class="btn btn-sm btn-soft" data-a="resetProfile">${ui.confirmReset?'Tap again to confirm':'Reset profile data'}</button></div></div>
     <button class="btn btn-line btn-block" data-a="ask" data-v="I want to talk to a person">${I.person} Talk to a person</button>
     <button class="btn btn-ghost btn-block" data-a="sheet" data-v="presenter">${I.play} Demo scenarios & reset</button>
     <div class="card stack" style="gap:8px"><b>About this prototype</b><p class="faint" style="margin:0">Auchan Dayli is an unofficial Auchan × EDHEC university concept. All products, prices, people and results are fictional demo data.</p>
      <div class="row" style="align-items:flex-start"><span class="tagf mvp">MVP</span><span class="faint">Estimates, meal plans, smart list, Drive/delivery suggestions, scripted assistant, human handover, in-app reminders.</span></div>
      <div class="row" style="align-items:flex-start"><span class="tagf fut">Future</span><span class="faint">Shelf NFC tags, product photo recognition and the Smart Basket Scan station need in-store hardware and are simulated here.</span></div></div>`);
  },
  why(){ return sheetFrame('Why this suggestion?',`<p style="margin:0;font-size:15px">${esc(ui.arg)}</p><div class="why">${I.info}<span>Suggestions use simulated purchase history and the habits you confirmed. You can change or turn them off in You & your data.</span></div><button class="btn btn-ghost btn-block" data-a="sheet" data-v="settings">Personalization settings</button>`); },
  presenter(){ return sheetFrame('Demo scenarios',`<div class="presenter-sheet">${presenterHTML()}</div>`); },
};
</script>
<script>
/* ================= ASK AUCHAN (scripted assistant) ================= */
const PROMPTS=[['🍽','Plan my meals for the week.'],['🥬','What can I cook with what I have?'],['💶','Help me stay within my budget.'],['🐕','When should I buy dog food again?'],['📦','Something is missing from my order.']];
function aiMsg(t,b=[]){ return {r:'ai',t,b}; }
function intent(q){
  const s=q.toLowerCase();
  if(/person|human|advisor|agent|someone|customer service/.test(s)) return 'person';
  if(/missing|order issue|refund|damaged|wrong item/.test(s)) return 'order';
  if(/complete|pasta dinner|side/.test(s)) return 'expand';
  if(/dog|kibble|pet/.test(s)) return 'dog';
  if(/budget|spend|afford|cheap|money/.test(s)) return 'budget';
  if(/cook|have at home|fridge|leftover|what can i make|cake/.test(s)) return 'cook';
  if(/plan|meal|week|dinner/.test(s)) return 'plan';
  if(/detergent|laundry|washing/.test(s)) return 'det';
  if(/soap|essential|refill|run out|running low/.test(s)) return 'ess';
  if(/store|aisle|in-store|in store/.test(s)) return 'store';
  if(/drive|deliver|pickup|slot|when should i shop/.test(s)) return 'slot';
  if(/^(hi|hello|hey|bonjour|hola)\b/.test(s)) return 'hello';
  return 'other';
}
function reply(k){
  const d=remaining('dogfood');
  switch(k){
    case 'plan': { const {miss}=planMissing(planMeals()); return [aiMsg(`Here’s a five-dinner plan for ${S.hh.adults+S.hh.kids}, each ready in ${S.hh.prep} minutes or less. I’ve used the rice, onions, garlic and spinach you already have.`,[{k:'plan'}]),
      aiMsg(`Adding the ${miss.length} missing ingredients comes to ${money(sum(miss))}, which keeps your food list within your ${money(budget())} budget. Swap any dinner before adding.`)]; }
    case 'cook': return [aiMsg('With what’s at home, here are two ideas. The spinach is the one to use first.',[{k:'recipes',ids:['spinachpenne','omelette']}]),
      aiMsg(`With the milk, sugar and flour already at home, you’re one ingredient away from a simple cake. Add eggs for ${money(pr('eggs'))} and you’ll have the ingredients for a simple cake.`,[{k:'prod1',id:'eggs',src:'Cake idea',label:'Add eggs · '+money(pr('eggs'))}])];
    case 'budget': return [aiMsg(`Your food list is at ${money(foodTotal())} of your ${money(budget())} weekly budget. Household and pet essentials are tracked separately (${money(essTotal())}).`,[{k:'budget'}]),
      aiMsg('I’ll always show the price before you add anything, and I won’t add paid items without your OK. Want me to plan dinners that fit what’s left?',[{k:'acts',list:[['Plan dinners within budget','sheet','plan'],['See this week’s loyalty prices','shopOffers','']]}])];
    case 'dog': return [aiMsg(`You opened the last 3 kg bag ${S.ess.dogfood.opened+S.day} days ago, and you told me one usually lasts about 3 weeks. So it may run out ${d<=0?'about now':'around '+dateIn(d)}.`),
      aiMsg(`Adding it to Thursday’s ${C().drive.toLowerCase()} would get it home before then.`,[{k:'prod1',id:'dogfood',src:'Replenish',label:'Add usual bag · '+money(pr('dogfood'))},{k:'acts',list:[['Adjust the estimate','openEss','dogfood']]}])];
    case 'expand': return [aiMsg('Make it a complete dinner with grated cheese and a side salad. Pick what you’d like.',[{k:'prods',ids:['cheese','salad'],src:'Dinner idea'}])];
    case 'det': return [aiMsg(`At ${S.hh.laundry} loads a week, your detergent may need a refill ${remaining('detergent')<=7?'this week':'next week'}. The XL bottle costs more today but lasts about twice as long.`,[{k:'acts',list:[['Compare formats','sheet','detergent']]}])];
    case 'ess': return [aiMsg(`${reviewCount()} essential${reviewCount()===1?'':'s'} may need a look soon. These are estimates from your usual purchases, not live stock.`,[{k:'acts',list:[['Open My Home','tab','home']]}])];
    case 'store': return [aiMsg('Your list is sorted by aisle for in-store mode, with a running total and your budget in view.',[{k:'acts',list:[['Start in-store mode','store','']]}])];
    case 'slot': return [aiMsg(`I’d suggest Thursday 18:00–18:30 ${C().drive.toLowerCase()}: you usually shop Thursdays, the slot shows good availability (simulated), and it arrives before your dog food runs low.`,[{k:'acts',list:[['See slots','sheet','checkout']]}])];
    case 'order': return [aiMsg('I’m sorry about that. Here’s your latest order. Which item is missing?',[{k:'order'}])];
    case 'person': return [aiMsg('Of course. I’ll pass a short summary to a customer service advisor so you don’t have to repeat yourself. Please check it first.',[{k:'handover'}])];
    case 'hello': return [aiMsg('Hello Léa! I can plan meals, keep an eye on essentials, and help with orders. What would you like to do?',[{k:'suggest'}])];
    default: return [aiMsg('I can’t help with that in this demo. I’m a scripted prototype, so I only cover a few journeys. Here’s what I can do:',[{k:'suggest'}])];
  }
}
function send(text){
  if(!text||ui.typing) return;
  ui.tab='ask'; ui.cap=false;
  S.chat.push({r:'u',t:text});
  const k=intent(text); if(k==='order'||k==='person') S.topic=S.topic||(k==='order'?'Missing item from order':'General request');
  ui.typing=true; render(); scrollChat();
  const out=reply(k);
  let i=0; const step=()=>{ S.chat.push(out[i++]); if(i<out.length){ render(); scrollChat(); setTimeout(step,650);} else { ui.typing=false; save(); render(); scrollChat(); advanceFor('chat:'+k); } };
  setTimeout(step,reduced()?50:800);
}
function scrollChat(){ requestAnimationFrame(()=>{ const s=$('scroller'); s.scrollTop=s.scrollHeight; }); }
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

function block(b,mi,bi){
  const ref=`${mi}:${bi}`;
  switch(b.k){
    case 'plan': { const meals=planMeals(), {miss}=planMissing(meals), cost=mealShare(meals);
      return `<div class="rich"><div class="between"><b>5 dinners · ${S.hh.adults+S.hh.kids} servings</b><span class="demo-tag">Demo prices</span></div>
      ${meals.map((m,i)=>`<div class="row" style="gap:10px"><div class="meal-img" style="background:${MEALS[m].t};width:44px;height:44px;font-size:22px;border-radius:12px">${MEALS[m].e}</div><div style="flex:1;min-width:0"><b style="font-size:13.5px">${DAYS[i]} · ${MEALS[m].n}</b><div class="faint">${MEALS[m].min} min · ~${money(cost(m))} to buy</div></div></div>`).join('')}
      <div class="btn-row">${S.plan&&S.plan.added&&!miss.length?`<span class="pill ok">✓ Plan added to My List</span>`:`<button class="btn btn-sm btn-red" data-a="addPlan">Add ${miss.length} missing · ${money(sum(miss))}</button>`}<button class="btn btn-sm btn-ghost" data-a="sheet" data-v="plan">Review & swap</button></div></div>`; }
    case 'recipes': return `<div class="hscroll">${b.ids.map(m=>{ const miss=MEALS[m].ing.filter(i=>!atHome(i)&&!inList(i)); return `<div class="recipe-card"><div class="meal-img" style="background:${MEALS[m].t}">${MEALS[m].e}</div><div class="rc-b"><b style="font-size:13.5px">${MEALS[m].n}</b><span class="faint">${MEALS[m].min} min · ${miss.length?miss.length+' to buy · '+money(sum(miss)):'all ingredients ready'}</span>${miss.length?`<button class="btn btn-sm btn-dark" data-a="addMany" data-v="${miss.join(',')}" data-src="Recipe">Add missing · ${money(sum(miss))}</button>`:`<span class="pill ok">✓ Ready to cook</span>`}</div></div>`; }).join('')}</div>`;
    case 'prod1': { const st=b.done||(inList(b.id)?'added':null);
      return `<div class="rich"><div class="row">${tile(b.id,52)}<div style="flex:1"><b>${nm(b.id)}</b><div class="faint">${P[b.id].u}</div></div><span class="price">${money(pr(b.id))}</span></div>
       ${st==='added'?`<span class="pill ok">✓ Added to My List</span>`:st==='no'?`<span class="pill neutral">Not added</span>`:`<div class="btn-row"><button class="btn btn-sm btn-red" data-a="blkAdd" data-v="${ref}">${esc(b.label)}</button><button class="btn btn-sm btn-ghost" data-a="blkNo" data-v="${ref}">Not now</button></div>`}</div>`; }
    case 'prods': { const sel=ui.sel[ref]||(ui.sel[ref]=Object.fromEntries(b.ids.map(i=>[i,true]))); const picked=b.ids.filter(i=>sel[i]);
      return `<div class="rich"><div class="hscroll">${b.ids.map(i=>`<button class="pmini ${sel[i]?'sel':''}" data-a="blkSel" data-v="${ref}" data-p="${i}" aria-pressed="${!!sel[i]}" ${b.done?'disabled':''}>${tile(i)}<b>${nm(i)}</b><span class="faint">${P[i].u}</span><span class="price">${money(pr(i))}</span></button>`).join('')}</div>
       ${b.done==='added'?`<span class="pill ok">✓ Added to My List</span>`:b.done==='no'?`<span class="pill neutral">Not added</span>`:`<div class="between"><span class="faint">Combined extra cost</span><b class="num">+${money(sum(picked))}</b></div><div class="btn-row"><button class="btn btn-sm btn-red" data-a="blkAddSel" data-v="${ref}" ${picked.length?'':'disabled'}>Add ${picked.length} · ${money(sum(picked))}</button><button class="btn btn-sm btn-ghost" data-a="blkNo" data-v="${ref}">No thanks</button></div>`}</div>`; }
    case 'budget': return `<div class="rich">${budgetBar()}</div>`;
    case 'acts': return `<div class="btn-row">${b.list.map(([l,a,v])=>`<button class="btn btn-sm btn-line" data-a="${a}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;
    case 'suggest': return `<div class="quick" style="flex-wrap:wrap">${PROMPTS.map(p=>`<button data-a="ask" data-v="${p[1]}">${p[1]}</button>`).join('')}</div>`;
    case 'order': { const o=S.orders[0];
      return `<div class="rich"><div class="between"><b>Order ${o.id}</b><span class="pill check">Demo order</span></div><span class="faint">${o.when}</span>
       ${o.items.map(([p,q])=>`<div class="row" style="gap:10px">${tile(p,36)}<span style="flex:1;font-size:13.5px">${nm(p)} × ${q}</span>${b.done?(b.done===p?'<span class="pill check">Missing</span>':''):`<button class="btn btn-sm btn-ghost" data-a="missing" data-v="${ref}" data-p="${p}">Missing</button>`}</div>`).join('')}</div>`; }
    case 'resolve': return b.done?`<span class="pill ok">✓ ${esc(b.done)}</span>`:`<div class="btn-row"><button class="btn btn-sm btn-red" data-a="refund" data-v="${ref}">Refund ${money(pr(b.p))} to loyalty balance</button><button class="btn btn-sm btn-line" data-a="ask" data-v="I want to talk to a person">${I.person} Talk to a person</button></div>`;
    case 'handover': { const o=S.orders[0], miss=o.issue;
      return `<div class="rich"><div class="eyebrow">Summary for the advisor</div>
       <div class="stack" style="gap:6px;font-size:13.5px"><div class="between"><span class="muted">Customer</span><b>Léa M. (demo profile)</b></div><div class="between"><span class="muted">Topic</span><b>${esc(S.topic||'General request')}</b></div>${miss?`<div class="between"><span class="muted">Order</span><b>${o.id} · ${nm(miss)} missing</b></div>`:''}<div class="between"><span class="muted">Market</span><b>${C().name} · ${C().lang}</b></div><div class="between"><span class="muted">Shared</span><b>Last ${Math.min(6,S.chat.length)} messages</b></div></div>
       ${b.done==='yes'?`<span class="pill ok">✓ Shared with your consent</span>`:b.done==='no'?`<span class="pill neutral">Not shared</span>`:`<div class="btn-row"><button class="btn btn-sm btn-red" data-a="handover" data-v="${ref}">Share & connect</button><button class="btn btn-sm btn-ghost" data-a="blkNo" data-v="${ref}">Cancel</button></div>`}</div>`; }
    case 'translate': { const c=C().cs;
      return `<div class="rich"><div class="between"><b>Multilingual support</b><span class="pill info">Translation example · demo</span></div>
       <div class="stack" style="gap:8px;font-size:13.5px"><div><div class="eyebrow">Customer wrote (${C().lang})</div><i>“${c.orig}”</i><div class="faint">Advisor sees: “${c.tr}”</div></div><div class="divider"></div><div><div class="eyebrow">Advisor replied (English)</div>“${c.replyTr}”<div class="faint">Customer sees: <i>“${c.reply}”</i></div></div></div>
       <span class="faint">Scripted example. No live translation service is used.</span></div>`; }
  }
  return '';
}
function renderAsk(){
  if(!S.chat.length) return `<div class="stack-lg" style="padding-top:6px">
   <div class="stack" style="align-items:flex-start"><span style="width:64px;height:64px;border-radius:22px;background:var(--red);display:grid;place-items:center;box-shadow:0 10px 24px rgba(225,0,26,.28)">${bird(48)}</span>
   <h1 class="h-xl">Hi Léa, what can I help with?</h1><p class="muted" style="margin:0">I plan meals, watch your essentials and sort out orders. You stay in control of every addition.</p><span class="demo-tag">Scripted demo assistant</span></div>
   <div class="suggest">${PROMPTS.map(p=>`<button data-a="ask" data-v="${p[1]}"><span class="s-ico">${p[0]}</span>${p[1]}</button>`).join('')}</div>
   <button class="btn btn-line" data-a="ask" data-v="I want to talk to a person">${I.person} Talk to a person</button></div>`;
  return `<div class="chat" aria-live="polite">${S.chat.map((m,mi)=>{
    const an=mi>=(ui.seen||0)?' anim':''; if(m.r==='u') return `<div class="msg user${an}">${esc(m.t)}</div>`;
    if(m.r==='sys') return `<div class="msg sys${an}">${esc(m.t)}</div>`;
    return `<div class="msg ai ${m.r==='ag'?'agent':''}${an}"><span class="av">${m.r==='ag'?'<b style="color:#fff;font-size:12px">CM</b>':bird(22)}</span><div class="bubble">${m.t?`<div class="txt">${m.r==='ag'?'<b style="font-size:12px;color:var(--blue)">Camille · Customer service (simulated)</b><br>':''}${esc(m.t)}</div>`:''}${(m.b||[]).map((b,bi)=>block(b,mi,bi)).join('')}</div></div>`;
